<div class="register-page">
  <div class="space-background"></div>
  <div class="stars"></div>

  <div class="lang-switcher-register">
    <button
      type="button"
      class="lang-toggle"
      (click)="toggleLangMenu()">
      <span class="lang-icon">🌐</span>
      <span class="lang-current">
        {{ currentLang === 'es' ? ('LANG.ES' | translate) : ('LANG.EN' | translate) }}
      </span>
      <span class="lang-arrow">▾</span>
    </button>

    <div class="lang-dropdown" *ngIf="showLangMenu">
      <button
        type="button"
        class="lang-option"
        [class.active]="currentLang === 'es'"
        (click)="selectLanguage('es')">
        🇪🇸 {{ 'LANG.ES' | translate }}
      </button>

      <button
        type="button"
        class="lang-option"
        [class.active]="currentLang === 'en'"
        (click)="selectLanguage('en')">
        🇬🇧 {{ 'LANG.EN' | translate }}
      </button>
    </div>
    
    <button class="theme-toggle-register" (click)="toggleTheme()">
      {{ theme() === 'dark' ? '☀️' : '🌙' }}
    </button>
  </div>

  <div class="register-container">
    <div class="register-card">
      <div class="register-header">
        <h1 class="register-title">{{ 'REGISTER.TITLE' | translate }}</h1>
        <p class="register-subtitle">{{ 'REGISTER.SUBTITLE' | translate }}</p>
      </div>

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label class="form-label" for="username">
            {{ 'REGISTER.USERNAME_LABEL' | translate }}
          </label>
          <input
            id="username"
            type="text"
            class="form-input"
            [(ngModel)]="username"
            name="username"
            [placeholder]="'REGISTER.USERNAME_PLACEHOLDER' | translate"
            required
            minlength="3"
          />
          <div class="error-message" *ngIf="errors.username">
            {{ errors.username }}
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">
            {{ 'REGISTER.EMAIL_LABEL' | translate }}
          </label>
          <input
            id="email"
            type="email"
            class="form-input"
            [(ngModel)]="email"
            name="email"
            [placeholder]="'REGISTER.EMAIL_PLACEHOLDER' | translate"
            required
          />
          <div class="error-message" *ngIf="errors.email">
            {{ errors.email }}
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="birthday">
            {{ 'REGISTER.BIRTHDAY_LABEL' | translate }}
          </label>
          <input
            id="birthday"
            type="date"
            class="form-input"
            [(ngModel)]="birthday"
            name="birthday"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            {{ 'REGISTER.PASSWORD_LABEL' | translate }}
          </label>
          <div class="password-wrapper">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              class="form-input"
              [(ngModel)]="password"
              name="password"
              [placeholder]="'REGISTER.PASSWORD_PLACEHOLDER' | translate"
              required
              minlength="6"
            />
            <button
              type="button"
              class="toggle-password"
              (click)="togglePasswordVisibility()">
              {{ showPassword ? '👁️' : '👁️‍🗨️' }}
            </button>
          </div>
          <div class="error-message" *ngIf="errors.password">
            {{ errors.password }}
          </div>
        </div>

        <div class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <button type="submit" class="btn-register" [disabled]="loading">
          <span class="loading-spinner" *ngIf="loading"></span>
          {{ loading ? ('REGISTER.LOADING' | translate) : ('REGISTER.SUBMIT' | translate) }}
        </button>
      </form>

      <div class="login-link">
        {{ 'REGISTER.ALREADY_HAVE_ACCOUNT' | translate }}
        <a routerLink="/login">{{ 'REGISTER.LOGIN_LINK' | translate }}</a>
      </div>
    </div>
  </div>
</div>
